<div class="board" role="grid" aria-label="Tic Tac Toe board">
  <button
    *ngFor="let cell of board; let i = index"
    type="button"
    class="cell"
    [class.filled]="cell !== null"
    [class.winning]="isWinningCell(i)"
    [class.x]="cell === 'X'"
    [class.o]="cell === 'O'"
    [disabled]="disabled || cell !== null"
    (click)="onCellClick(i)"
    [attr.aria-label]="'Cell ' + (i + 1) + (cell ? ', ' + cell : ', empty')"
  >
    {{ cell }}
  </button>
</div>
