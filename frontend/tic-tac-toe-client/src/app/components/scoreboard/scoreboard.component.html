<div class="panel">
  <h3>Scoreboard</h3>
  <div class="rows">
    <div class="row">
      <span class="label x">X Wins</span>
      <span class="value">{{ scoreboard.xWins }}</span>
    </div>
    <div class="row">
      <span class="label o">O Wins</span>
      <span class="value">{{ scoreboard.oWins }}</span>
    </div>
    <div class="row">
      <span class="label">Draws</span>
      <span class="value">{{ scoreboard.draws }}</span>
    </div>
  </div>
  <button type="button" class="btn btn-secondary" (click)="resetScoreboard.emit()">
    Reset Scoreboard
  </button>
</div>
